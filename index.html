    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Prevent accidental theme/background flash -->
    <meta name="theme-color" content="#0b1120" />

    <!-- SEO -->
    <meta
      name="description"
      content="VisaVerse - Modern Immigration, PR, Work Permit & Study Visa Consultancy"
    />

    <!-- Favicon -->

    />
